name: Package compatibility

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      [
        ".github/workflows/ci.yml",
        ".gitattributes",
        "package*.json",
        "wasm-build.json",
        "assets/package.json",
        "LICENSE",
        "NOTICE",
        "CORE-NOTICE",
        "THIRD_PARTY_NOTICES.txt",
        "src/**",
        "packages/**",
        "scripts/**",
        "test/**",
        "tsconfig*.json",
      ]
  push:
    branches: [main]
    paths:
      [
        ".github/workflows/ci.yml",
        ".gitattributes",
        "package*.json",
        "wasm-build.json",
        "assets/package.json",
        "LICENSE",
        "NOTICE",
        "CORE-NOTICE",
        "THIRD_PARTY_NOTICES.txt",
        "src/**",
        "packages/**",
        "scripts/**",
        "test/**",
        "tsconfig*.json",
      ]

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build pinned Wasm once
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      package-version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check README links against tracked files and GitHub
        run: npm run test:links -- --online
      - id: package-version
        name: Read package version
        shell: bash
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          sdk_version=$(node -p 'require("./wasm-build.json").emscripten')
          "$RUNNER_TEMP/emsdk/emsdk" install "$sdk_version"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$sdk_version"
      - name: Build verified package inputs
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          npm run pack:local
      - uses: actions/upload-artifact@v4
        with:
          name: verified-wasm
          if-no-files-found: error
          path: |
            assets/taiyin_web.mjs
            assets/taiyin_web.wasm
            assets/build-info.json
            assets/licenses/
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          if-no-files-found: error
          path: build/packages/*.tgz

  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: verified-wasm
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: build/candidate
      - run: npm test
      - run: npm run test:types
      - run: npm run test:integration
      - run: npm run test:astronomy
      - run: npm run test:bazi-reverse
      - run: npm run test:package -- --archive build/candidate/js-ephemeris-${{ needs.build.outputs.package-version }}.tgz --browsers none
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-${{ matrix.node }}-${{ matrix.os }}-report
          path: build/package-test-result.json

  browsers:
    name: Browser engines and Vite / ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # macOS 14 forces Playwright's frozen WebKit 2251 override, rather
        # than the current WebKit used on Linux and macOS 15+.
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: verified-wasm
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: build/candidate
      - run: npx playwright-core install --with-deps chromium firefox webkit
      - run: npm run test:package -- --archive build/candidate/js-ephemeris-${{ needs.build.outputs.package-version }}.tgz --browsers chromium,firefox,webkit --vite
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browsers-${{ matrix.os }}-report
          path: build/package-test-result.json
